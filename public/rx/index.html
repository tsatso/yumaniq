<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/rx/">
<title>RAST Rx — Motor Intelligence for Physical AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'DM Sans',sans-serif;background:#0a0c10;color:#e2e4ea;overflow-x:hidden}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#1e2330;border-radius:3px}
  button{font-family:'DM Sans',sans-serif;cursor:pointer}input{font-family:'DM Sans',sans-serif}

  /* Nav */
  .tn{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:44px;background:rgba(10,12,16,0.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.06)}
  .tn-logo{font-weight:800;font-size:13px;letter-spacing:2px;color:#4b5563;flex-shrink:0}
  .tn-logo span{color:#3b82f6}
  .tn-tabs{display:flex;gap:1px;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 8px}
  .tn-tab{padding:5px 12px;border-radius:5px;font-size:11px;font-weight:600;color:#4b5563;background:transparent;border:none;white-space:nowrap;transition:all 0.2s}
  .tn-tab:hover{color:#9ca3af}.tn-tab.act{color:#3b82f6;background:rgba(59,130,246,0.1)}

  /* Bottom nav */
  .bn{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(10,12,16,0.94);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,0.06)}
  .bn-btn{padding:9px 20px;border-radius:8px;font-size:13px;font-weight:600;border:none;transition:all 0.2s}
  .bn-prev{background:rgba(255,255,255,0.04);color:#6b7280}.bn-prev:hover{color:#e2e4ea}
  .bn-next{background:#3b82f6;color:white}.bn-next:hover{background:#2563eb}
  .bn-dots{display:flex;gap:5px}
  .bn-dot{width:6px;height:6px;border-radius:50%;background:#1e2330}.bn-dot.act{background:#3b82f6;width:18px;border-radius:3px}
  .bn-ghost{width:90px}

  /* Screen layout */
  .scr{padding:52px 0 60px;display:flex;flex-direction:column;align-items:center}
  .si{width:100%;max-width:820px;padding:0 24px}
  .banner{width:100%;height:140px;border-radius:10px;overflow:hidden;margin-bottom:20px;background-size:cover;background-position:center 30%;position:relative}
  .banner::after{content:'';position:absolute;inset:0;background:linear-gradient(to right,rgba(10,12,16,0.8) 0%,rgba(10,12,16,0.3) 50%,rgba(10,12,16,0.6) 100%);pointer-events:none}
  .banner-text{position:absolute;bottom:12px;left:16px;z-index:1;font-size:15px;font-weight:700}
  .stag{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;margin-bottom:8px}
  .st{font-size:28px;font-weight:800;line-height:1.2;margin-bottom:8px}
  .ss{font-size:15px;color:#7f8694;line-height:1.6;margin-bottom:20px;max-width:640px}
  .cr{color:#ef4444}.cb{color:#3b82f6}.cg{color:#10b981}.ca{color:#f59e0b}.cp{color:#a78bfa}.cw{color:#e2e4ea}
  .card{background:#12151c;border:1px solid #1e2330;border-radius:10px;padding:18px;width:100%;margin-bottom:16px}
  .co{padding:14px 18px;border-radius:8px;font-size:14px;line-height:1.6;color:#9ca3af;margin-bottom:16px;width:100%}
  .co-r{background:rgba(239,68,68,0.05);border:1px solid rgba(239,68,68,0.1)}
  .co-g{background:rgba(16,185,129,0.05);border:1px solid rgba(16,185,129,0.1)}
  .co-a{background:rgba(245,158,11,0.04);border:1px solid rgba(245,158,11,0.1)}
  .divider{width:100%;height:1px;background:#1e2330;margin:20px 0}

  /* Two-column grid */
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;margin-bottom:16px}

  /* Trajectory canvas */
  .traj-card{background:#12151c;border:1px solid #1e2330;border-radius:10px;padding:14px;width:100%}
  .traj-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:600;margin-bottom:10px}
  .traj-canvas{width:100%;height:140px;display:block}
  .metric-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px}
  .metric-row span:first-child{color:#6b7280}
  .metric-bar{width:60px;height:3px;background:#1e2330;border-radius:2px;display:inline-block;position:relative;overflow:hidden;margin-left:8px;vertical-align:middle}
  .metric-fill{position:absolute;left:0;top:0;height:100%;border-radius:2px}

  /* Weights */
  .wi{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
  .wi:last-child{border-bottom:none}
  .wn{min-width:130px;font-size:14px;font-weight:500}
  .wt{flex:1;height:8px;background:rgba(255,255,255,0.04);border-radius:4px;position:relative;overflow:hidden}
  .wf{position:absolute;left:0;top:0;height:100%;border-radius:4px}
  .wv{font-family:'JetBrains Mono',monospace;font-size:13px;min-width:38px;text-align:right;color:#6b7280}
  .tg{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:3px;min-width:44px;text-align:center}
  .tg-t{background:rgba(16,185,129,0.12);color:#10b981}
  .tg-s{background:rgba(245,158,11,0.12);color:#f59e0b}
  .tg-m{background:rgba(139,92,246,0.12);color:#a78bfa}

  /* Dots */
  .dr{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .dl{min-width:100px;font-size:12px;color:#6b7280}
  .dt{flex:1;height:20px;position:relative}
  .dd{position:absolute;width:10px;height:10px;border-radius:50%;top:5px}

  /* Transfer */
  .cb-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .cb-btn{padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;background:#12151c;border:1px solid #1e2330;color:#6b7280;transition:all 0.2s}
  .cb-btn.sel{border-color:rgba(139,92,246,0.4);background:rgba(139,92,246,0.08);color:#a78bfa}
  .cb-btn:hover{border-color:rgba(139,92,246,0.3);color:#a78bfa}
  .rg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;width:100%}

  /* Chat */
  .cmsg{padding:14px 16px;margin-bottom:8px;border-radius:10px;font-size:15px;line-height:1.6;white-space:pre-wrap}
  .cm-s{background:#12151c;border:1px solid #1e2330;color:#6b7280}
  .cm-u{background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.15);margin-left:40px}
  .cm-a{background:#12151c;border:1px solid #1e2330;margin-right:40px}
  .qb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .qb button{padding:6px 12px;background:#12151c;border:1px solid #1e2330;border-radius:16px;color:#6b7280;font-size:12px;transition:all 0.2s}
  .qb button:hover{border-color:#3b82f6;color:#e2e4ea}

  @media(max-width:768px){
    .si{padding:0 14px}
    .banner{height:110px;border-radius:8px}
    .st{font-size:22px}
    .ss{font-size:14px}
    .g2{grid-template-columns:1fr}
    .rg{grid-template-columns:1fr}
    .cm-u{margin-left:16px}.cm-a{margin-right:16px}
    .tn-tab{font-size:10px;padding:4px 8px}
    .wn{min-width:100px;font-size:12px}
    .traj-canvas{height:110px}
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const API="/api/anthropic";
const{useState,useRef,useEffect,useCallback}=React;

const SYS=`You are the RAST demo assistant for autonomous heavy equipment experts. CORE: Deploying physical AI is medicine without prescription. 40-50% experts retiring. 700% gap. $22K/min downtime. RAST CHAIN: Diagnosis (IOC) → Prescription (decompose+transfer) → Governance (1kHz safety). Expert identity: fill 0.87 TRAIT, compliance 0.74 TRAIT, smooth 0.62 TRAIT, stress 0.68 STATE, speed 0.45 STATE. RL learns what to DO. RAST learns what to CARE ABOUT. HONEST: validated on synthetic/vocal data. Excavation is target. Demo is interactive explanation. Lead with risk. Be direct. Never overclaim.`;

const TX=`RAST prescription engine. Expert: fill 0.87 TRAIT, compliance 0.74 TRAIT, smooth 0.62 TRAIT, stress 0.68 STATE, speed 0.45 STATE. Original: 94% fill, 18.2s. TRAIT preserved, STATE re-optimized. RESPOND ONLY JSON: {"label":"2-4 words","description":"3-4 sentences specific angles/depths/timing. End fill% cycle.","rastFill":<50-95>,"lfdFill":<15-45>,"rastNote":"Why prescription works.","lfdNote":"Why fails.","adaptations":["1","2","3"]} Physically realistic.`;

const CD={clay:{l:"Dense Clay",d:"Shallower descent (22°). Slower curl, compliance reliance. Micro-adjustments against adhesion.",rf:89,lf:41,rn:"Fill priority preserved.",ln:"Trajectory jams."},frozen:{l:"Frozen Ground",d:"Break-and-scoop. Pecking to fracture, then compliance scoop.",rf:82,lf:28,rn:"Novel trajectory, same priorities.",ln:"Bounces off."},underwater:{l:"Underwater",d:"Compensates drag/buoyancy. Force-dominant strategy.",rf:85,lf:35,rn:"Force-dominant. Fill preserved.",ln:"Drag overshoot."},lunar:{l:"Lunar (0.16g)",d:"Gentle curl prevents ejection. Compliance adapts to minimal gravity.",rf:78,lf:22,rn:"Transfers across gravity.",ln:"Ejects material."},mars:{l:"Mars (0.38g)",d:"Abrasive regolith. Curl adapted for reduced friction.",rf:83,lf:31,rn:"Novel physics adapted.",ln:"Soil unrecognized."}};
const WTS=[{n:"Fill Efficiency",v:0.87,t:"t"},{n:"Machine Compliance",v:0.74,t:"t"},{n:"Smoothness",v:0.62,t:"t"},{n:"Bucket Stress",v:0.68,t:"s"},{n:"Cycle Speed",v:0.45,t:"s"},{n:"Fuel Economy",v:0.55,t:"m"}];
const DEC=[{n:"Fill Efficiency",t:"t",icc:0.91,d:[84,88,86,90]},{n:"Compliance",t:"t",icc:0.84,d:[72,76,70,78]},{n:"Smoothness",t:"t",icc:0.78,d:[60,58,64,66]},{n:"Bucket Stress",t:"s",icc:0.38,d:[68,42,55,80]},{n:"Cycle Speed",t:"s",icc:0.31,d:[45,28,35,62]},{n:"Fuel Economy",t:"m",icc:0.54,d:[55,48,42,60]}];
const DCL=["#60a5fa","#34d399","#fbbf24","#f87171"],DLL=["Gravel","Clay","Wet","Rocky"];
const QQ=["How is this different from RL?","What sensors needed?","Works with signal delay?","Safety failures?","How long to extract?"];
const LB=["The Risk","Diagnose","Decompose","Prescribe","Ask RAST"];

function drawPath(c,pts,color,label){
  if(!c)return;const ctx=c.getContext("2d");const dpr=window.devicePixelRatio||1;
  const w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;
  c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="rgba(255,255,255,0.03)";ctx.lineWidth=1;
  for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(0,i*h/6);ctx.lineTo(w,i*h/6);ctx.stroke()}
  ctx.strokeStyle="rgba(255,255,255,0.06)";ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(0,h*0.38);ctx.lineTo(w,h*0.38);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle="rgba(255,255,255,0.1)";ctx.font="9px 'DM Sans'";ctx.fillText("surface",4,h*0.38-4);
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();
  pts.forEach((p,i)=>{const x=p[0]*w,y=p[1]*h;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke();
  pts.forEach(p=>{ctx.fillStyle=color;ctx.globalAlpha=0.35;ctx.beginPath();ctx.arc(p[0]*w,p[1]*h,2,0,Math.PI*2);ctx.fill()});
  ctx.globalAlpha=1;const last=pts[pts.length-1];ctx.fillStyle=color;ctx.beginPath();ctx.arc(last[0]*w,last[1]*h,4,0,Math.PI*2);ctx.fill();
  if(label){ctx.fillStyle="rgba(255,255,255,0.2)";ctx.font="10px 'DM Sans'";ctx.fillText(label,4,h-6)}
}
const EP=[[.1,.15],[.2,.2],[.35,.35],[.45,.55],[.5,.7],[.52,.78],[.55,.82],[.6,.8],[.7,.65],[.8,.45],[.9,.25],[.95,.15]];
const NP=[[.1,.15],[.15,.25],[.2,.5],[.25,.75],[.3,.85],[.32,.88],[.35,.82],[.38,.85],[.42,.78],[.55,.7],[.7,.5],[.85,.3],[.95,.15]];

function Nav({cur,go}){return <nav className="tn"><div className="tn-logo">RAST <span>Rx</span></div>
  <div className="tn-tabs">{LB.map((l,i)=><button key={i} className={"tn-tab"+(i===cur?" act":"")} onClick={()=>go(i)}>{l}</button>)}</div></nav>}
function Bot({cur,go,n}){return <div className="bn">
  {cur>0?<button className="bn-btn bn-prev" onClick={()=>go(cur-1)}>← Back</button>:<div className="bn-ghost"/>}
  <div className="bn-dots">{Array.from({length:n}).map((_,i)=><div key={i} className={"bn-dot"+(i===cur?" act":"")}/>)}</div>
  {cur<n-1?<button className="bn-btn bn-next" onClick={()=>go(cur+1)}>{LB[cur+1]} →</button>:<div className="bn-ghost"/>}
</div>}

function MR({label,value,color,pct}){return <div className="metric-row"><span>{label}</span><span style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontFamily:"'JetBrains Mono'",fontWeight:500,color,fontSize:13}}>{value}</span><span className="metric-bar"><span className="metric-fill" style={{width:pct+"%",background:color}}/></span></span></div>}

// ── Screen 1: Risk ──
function S1(){
  const er=useRef(null),nr=useRef(null);
  useEffect(()=>{setTimeout(()=>{
    drawPath(er.current,EP,"#3b82f6","Gradual approach, compliance scoop, smooth lift");
    drawPath(nr.current,NP,"#ef4444","Steep dive, stall, retry, jerky lift");
  },100)},[]);
  return <div className="scr"><div className="si">
    <div className="banner" style={{backgroundImage:"url(panel1_risk.png)"}}>
      <div className="banner-text"><span className="cr">$22K/min downtime.</span> Guardrails won't save you.</div></div>
    <div className="stag cr">The Risk</div>
    <div className="st"><span className="cr">700% gap.</span> 40% retiring. No capture.</div>
    <div className="ss">Physical AI without expert strategy is <span className="cr">medicine without prescription</span>. Your best operator's judgment isn't in any manual. When they leave, it's gone.</div>
    <div className="g2">
      <div className="traj-card">
        <div className="traj-label" style={{color:"#3b82f6"}}>Expert — 22 years</div>
        <canvas ref={er} className="traj-canvas"/>
        <MR label="Bucket fill" value="94%" color="#3b82f6" pct={94}/>
        <MR label="Cycle time" value="18.2s" color="#3b82f6" pct={38}/>
        <MR label="Machine stress" value="Low" color="#3b82f6" pct={22}/>
        <MR label="Fuel per ton" value="0.42L" color="#3b82f6" pct={32}/>
      </div>
      <div className="traj-card">
        <div className="traj-label" style={{color:"#ef4444"}}>Novice — 8 months</div>
        <canvas ref={nr} className="traj-canvas"/>
        <MR label="Bucket fill" value="58%" color="#ef4444" pct={58}/>
        <MR label="Cycle time" value="31.5s" color="#ef4444" pct={68}/>
        <MR label="Machine stress" value="High" color="#ef4444" pct={78}/>
        <MR label="Fuel per ton" value="0.89L" color="#ef4444" pct={72}/>
      </div>
    </div>
  </div></div>;
}

// ── Screen 2: Diagnose + Loss ──
function S2(){
  const tc=t=>t==="t"?"#3b82f6":t==="s"?"#f59e0b":"#a78bfa";
  const tl=t=>t==="t"?"tg-t":t==="s"?"tg-s":"tg-m";
  const tn=t=>t==="t"?"trait":t==="s"?"state":"mixed";
  return <div className="scr"><div className="si">
    <div className="banner" style={{backgroundImage:"url(panel2_diagnose.png)"}}>
      <div className="banner-text cb">Before you prescribe, diagnose.</div></div>
    <div className="stag cb">Step 1: Diagnosis</div>
    <div className="st">RAST captures what <span className="cr">no telemetry can</span>.</div>
    <div className="ss">The expert's <strong className="cw">actual optimization strategy</strong> — not what they did, but what they prioritized.</div>
    <div className="card">
      {WTS.map(w=><div key={w.n} className="wi">
        <span className="wn">{w.n}</span>
        <div className="wt"><div className="wf" style={{width:w.v*100+"%",background:tc(w.t)}}/></div>
        <span className="wv">{w.v.toFixed(2)}</span>
        <span className={"tg "+tl(w.t)}>{tn(w.t)}</span></div>)}
    </div>
    <div className="co co-r">
      <strong className="cr">Fill efficiency dominates. Experts don't rush.</strong> This hierarchy walks out the door when the expert retires.
    </div>
    <div className="divider"/>
    <div style={{display:"flex",gap:16,alignItems:"center",marginBottom:16}}>
      <div style={{width:80,height:80,borderRadius:10,overflow:"hidden",flexShrink:0,backgroundImage:"url(panel3_skill.png)",backgroundSize:"cover",backgroundPosition:"center"}}/>
      <div>
        <div style={{fontSize:18,fontWeight:800,marginBottom:4}}>His skill is <span className="ca">not in the manual</span>.</div>
        <div style={{fontSize:14,color:"#7f8694",lineHeight:1.5}}>When he leaves, the strategy leaves. No telemetry captures it. No training encodes it.</div>
      </div>
    </div>
    <div className="co co-a">
      <span className="cg">RAST extracts it before it disappears.</span> The diagnosis captures what exists only in the expert's motor system — then makes it transferable.
    </div>
  </div></div>;
}

// ── Screen 3: Decompose ──
function S3(){
  const tl=t=>t==="t"?"tg-t":t==="s"?"tg-s":"tg-m";
  const tn=t=>t==="t"?"trait":t==="s"?"state":"mixed";
  return <div className="scr"><div className="si">
    <div className="banner" style={{backgroundImage:"url(panel4_judgment.png)"}}>
      <div className="banner-text">Your judgment stays. <span className="ca">Your tools adapt.</span></div></div>
    <div className="stag cg">Step 2: Decompose</div>
    <div className="st">Some priorities are <span className="cg">the operator</span>. Some are <span className="ca">the situation</span>.</div>
    <div className="ss">Mix them up and the prescription fails. <strong className="cw">Clustered = the operator. Scattered = the situation.</strong></div>
    <div className="card">
      <div style={{display:"flex",gap:12,marginBottom:14,fontSize:12,color:"#6b7280"}}>
        {DLL.map((l,i)=><span key={l} style={{display:"flex",alignItems:"center",gap:4}}>
          <span style={{width:9,height:9,borderRadius:"50%",background:DCL[i],display:"inline-block"}}/>{l}</span>)}
      </div>
      {DEC.map(w=><div key={w.n} className="dr">
        <span className="dl">{w.n}</span>
        <div className="dt">{w.d.map((p,i)=><div key={i} className="dd" style={{left:p+"%",background:DCL[i]}}/>)}</div>
        <span className={"tg "+tl(w.t)} style={{fontSize:9}}>{tn(w.t)}</span>
        <span style={{fontFamily:"'JetBrains Mono'",fontSize:11,color:"#4b5563",minWidth:36}}>ICC {w.icc.toFixed(2)}</span></div>)}
    </div>
    <div className="co co-g">
      <strong className="cg">Without decomposition, gravel-specific responses transfer into clay — and fail.</strong> With it, only stable judgment transfers. Prescription, not guess.
    </div>
  </div></div>;
}

// ── Screen 4: Prescribe ──
function S4(){
  const [cond,setCond]=useState("clay");const [ci,setCi]=useState("");const [ld,setLd]=useState(false);const [dr,setDr]=useState(null);const [ic,setIc]=useState(false);
  const d=ic&&dr?dr:{label:CD[cond].l,description:CD[cond].d,rastFill:CD[cond].rf,lfdFill:CD[cond].lf,rastNote:CD[cond].rn,lfdNote:CD[cond].ln,adaptations:[]};
  function sp(k){setCond(k);setIc(false);setDr(null)}
  async function sub(t){const q=t||ci.trim();if(!q||ld)return;setCi("");setLd(true);setIc(true);
    try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:TX,messages:[{role:"user",content:"Prescription for: "+q}]})});
      const data=await r.json();if(data.error)throw new Error(data.error.message);
      const raw=data.content?.map(b=>b.type==="text"?b.text:"").join("")||"";
      const p=JSON.parse(raw.replace(/```json|```/g,"").trim());
      setDr({label:p.label||q,description:p.description||"",rastFill:p.rastFill||75,lfdFill:p.lfdFill||30,rastNote:p.rastNote||"",lfdNote:p.lfdNote||"",adaptations:p.adaptations||[]});
    }catch(e){setDr({label:q,description:"Error: "+e.message,rastFill:75,lfdFill:30,rastNote:"—",lfdNote:"—",adaptations:[]})}setLd(false)}
  return <div className="scr"><div className="si">
    <div className="banner" style={{backgroundImage:"url(panel5_prescription.png)"}}>
      <div className="banner-text"><span className="cg">Diagnosis done.</span> Prescription written.</div></div>
    <div className="stag cp">Step 3: The Prescription</div>
    <div className="st">Expert strategy for conditions <span className="cp">the expert never saw</span>.</div>
    <div className="ss">Choose a preset or <strong className="cw">describe any condition</strong>. The prescription generates in real time.</div>
    <div className="cb-row">{Object.entries(CD).map(([k,v])=><button key={k} className={"cb-btn"+(!ic&&k===cond?" sel":"")} onClick={()=>sp(k)}>{v.l}</button>)}</div>
    <div style={{display:"flex",gap:8,marginBottom:18}}>
      <input value={ci} onChange={e=>setCi(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sub()}
        placeholder="e.g. 'laterite in monsoon' or 'Mars permafrost -60°C'" style={{flex:1,background:"#12151c",border:"1px solid #1e2330",borderRadius:8,padding:"11px 14px",color:"#e2e4ea",fontSize:14,outline:"none"}}/>
      <button onClick={()=>sub()} disabled={ld} style={{padding:"11px 20px",background:ld?"#1e3a5f":"#8b5cf6",border:"none",borderRadius:8,color:"white",fontWeight:700,fontSize:14,whiteSpace:"nowrap"}}>{ld?"...":"Prescribe"}</button>
    </div>
    {ld&&<div style={{padding:16,background:"#12151c",border:"1px solid rgba(139,92,246,0.12)",borderRadius:8,textAlign:"center",marginBottom:14}}><span className="cp">Writing prescription...</span></div>}
    {!ld&&<div>
      <div className="card">
        <div style={{fontSize:12,letterSpacing:1.5,textTransform:"uppercase",fontWeight:700,color:"#a78bfa",marginBottom:6}}>
          {d.label}{ic&&dr&&<span style={{fontSize:9,padding:"2px 6px",background:"rgba(139,92,246,0.1)",borderRadius:3,marginLeft:6}}>GENERATED</span>}</div>
        <div style={{fontSize:14,color:"#9ca3af",lineHeight:1.6}}>{d.description}</div>
        {ic&&dr&&dr.adaptations?.length>0&&<div style={{marginTop:12,paddingTop:12,borderTop:"1px solid #1e2330"}}>
          {dr.adaptations.map((a,i)=><div key={i} style={{fontSize:13,color:"#6b7280",padding:"4px 0",display:"flex",gap:8}}><span className="cp" style={{fontWeight:700}}>{i+1}</span><span>{a}</span></div>)}</div>}
      </div>
      <div className="rg">
        <div style={{padding:16,background:"rgba(16,185,129,0.04)",border:"1px solid rgba(16,185,129,0.1)",borderRadius:8}}>
          <div style={{fontSize:10,letterSpacing:1.5,textTransform:"uppercase",color:"#10b981",fontWeight:700,marginBottom:4}}>RAST Prescription</div>
          <div style={{fontSize:36,fontWeight:800,color:"#10b981"}}>{d.rastFill}%</div>
          <div style={{fontSize:12,color:"#6b7280",marginTop:2}}>bucket fill</div>
          <div style={{fontSize:12,color:"#4b5563",marginTop:4}}>{d.rastNote}</div></div>
        <div style={{padding:16,background:"rgba(239,68,68,0.04)",border:"1px solid rgba(239,68,68,0.1)",borderRadius:8}}>
          <div style={{fontSize:10,letterSpacing:1.5,textTransform:"uppercase",color:"#ef4444",fontWeight:700,marginBottom:4}}>Without Prescription</div>
          <div style={{fontSize:36,fontWeight:800,color:"#ef4444"}}>{d.lfdFill}%</div>
          <div style={{fontSize:12,color:"#6b7280",marginTop:2}}>bucket fill</div>
          <div style={{fontSize:12,color:"#4b5563",marginTop:4}}>{d.lfdNote}</div></div>
      </div></div>}
  </div></div>;
}

// ── Screen 5: Ask RAST ──
function S5(){
  const [ms,setMs]=useState([{role:"system",content:"You've seen the pipeline: Diagnosis → Decomposition → Prescription. Now challenge it with your operations."}]);
  const [inp,setInp]=useState("");const [ld,setLd]=useState(false);const er=useRef(null);
  useEffect(()=>{er.current?.scrollIntoView({behavior:"smooth"})},[ms]);
  const send=useCallback(async(t)=>{const q=t||inp.trim();if(!q||ld)return;setInp("");
    const nm=[...ms,{role:"user",content:q}];setMs(nm);setLd(true);
    try{const am=nm.filter(m=>m.role!=="system").map(m=>({role:m.role==="user"?"user":"assistant",content:m.content}));
      const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:SYS,messages:am})});
      const data=await r.json();const tx=data.content?.map(b=>b.type==="text"?b.text:"").filter(Boolean).join("\n")||"Error.";
      setMs(p=>[...p,{role:"assistant",content:tx}])}catch(e){setMs(p=>[...p,{role:"assistant",content:"Error: "+e.message}])}setLd(false)},[inp,ms,ld]);
  return <div className="scr"><div className="si">
    <div className="stag cb">Ask RAST</div>
    <div className="st">The only system that <span className="cb">diagnoses</span>, <span className="cg">prescribes</span>, and <span className="ca">governs</span>.</div>
    <div className="ss">You've seen the pipeline. Now challenge it with your specific operations and edge cases.</div>
    <div className="qb">{QQ.map(q=><button key={q} onClick={()=>send(q)}>{q}</button>)}</div>
    <div style={{maxHeight:400,overflowY:"auto",marginBottom:14}}>
      {ms.map((m,i)=><div key={i} className={"cmsg "+(m.role==="system"?"cm-s":m.role==="user"?"cm-u":"cm-a")}>{m.content}</div>)}
      {ld&&<div className="cmsg cm-a" style={{color:"#6b7280"}}>Thinking...</div>}<div ref={er}/></div>
    <div style={{display:"flex",gap:8}}>
      <input value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}
        placeholder="Ask anything about RAST..." style={{flex:1,background:"#12151c",border:"1px solid #1e2330",borderRadius:8,padding:"11px 14px",color:"#e2e4ea",fontSize:15,outline:"none"}}/>
      <button onClick={()=>send()} disabled={ld} style={{padding:"11px 22px",background:ld?"#1e3a5f":"#3b82f6",border:"none",borderRadius:8,color:"white",fontWeight:700,fontSize:15}}>Send</button></div>
    <div style={{textAlign:"center",marginTop:24,paddingTop:14,borderTop:"1px solid #1e2330"}}>
      <div style={{fontSize:13,color:"#3d4452"}}>RAST Motor Intelligence — <a href="https://yumaniq.com" target="_blank" style={{color:"#3b82f6",textDecoration:"none"}}>yumaniq.com</a></div></div>
  </div></div>;
}

function App(){
  const [cur,setCur]=useState(0);
  const go=i=>{setCur(i);window.scrollTo(0,0)};
  const S=[S1,S2,S3,S4,S5];const X=S[cur];
  return <div><Nav cur={cur} go={go}/><div key={cur} style={{animation:"fadeIn 0.4s ease"}}><X/></div><Bot cur={cur} go={go} n={S.length}/></div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
