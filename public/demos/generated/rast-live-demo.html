CORE CONCEPT:
RAST (Robotic Adaptive Skill Transfer) decouples Motor Intent (cost function — what an operator optimizes for) from Motor Execution (the specific trajectory). Using Inverse Optimal Control (IOC), we extract the optimization strategy — the hidden priorities — behind expert movement. This "Motor Identity" captures intent, not trajectory, enabling transfer across physics changes where Learning from Demonstration (LfD) and imitation learning break.

SCIENTIFIC FOUNDATION:
- Optimal Feedback Control (Todorov & Jordan, 2002): movements are computed via real-time optimization, not memorized
- Inverse Optimal Control: given observed behavior + dynamics model, infer the cost function being optimized
- Novel RAST contribution: decomposing cost functions into Trait components (stable across conditions, transferable) vs State components (context-dependent, need recalibration)
- This addresses the gap Berniker et al. (2013) left unresolved — whether cost functions generalize across contexts

EXCAVATION DOMAIN KNOWLEDGE:
- Expert vs novice productivity gap in excavation is up to 700%
- Expert operators use fine-grained arm adjustments and slower descent to leverage physical compliance of the machine, ensuring full bucket scoops
- Key expert optimizations: fill efficiency (maximizing bucket load per scoop), machine compliance (using excavator weight/flexibility as part of technique), bucket stress management, cycle time
- Cost function for excavation: J = Σ [w_fill × fill_efficiency + w_compliance × machine_compliance_use + w_stress × bucket_stress + w_speed × cycle_time + w_smooth × jerk + w_fuel × fuel_consumption]
- Trait weights (stable across soil types): fill efficiency, machine compliance, smoothness
- State weights (adapt to conditions): cycle speed, bucket stress tolerance, fuel priority

RAST vs ALTERNATIVES:
- vs Reinforcement Learning: RL learns WHAT TO DO (policy, physics-specific, needs millions of episodes in target env). RAST learns WHAT TO CARE ABOUT (cost function, physics-independent, ~100 demonstrations)
- vs Learning from Demonstration (LfD): LfD copies trajectories — fails when conditions change. RAST extracts the strategy behind trajectories — transfers to any conditions
- vs VLA (Vision-Language-Action): Complementary. VLA is the "brain" (~5Hz, decides WHAT to do). RAST is the "spinal cord" (~1000Hz, computes HOW to move safely)

TRANSFER MECHANISM:
1. Extract Motor Identity from expert demonstrations (IOC)
2. Decompose into trait (stable) vs state (adaptive) components
3. Transfer trait weights to new dynamics model (different soil, machine, gravity)
4. Solver generates adapted trajectory preserving expert priorities
5. Safety Governor enforces bounds at 1kHz — every command is clipped to safe envelope

LATENCY APPLICATION:
For remote operations with signal delay (mining, Mars, underwater):
- Current teleoperation fails with >0.5s delay for dexterous tasks
- RAST approach: extract operator's Motor Identity once, transmit cost function (kilobytes) to remote robot
- Robot's local Solver computes optimal actions in real-time using expert's priorities
- Human sets the WHAT (priorities). Robot handles the HOW (execution). Latency becomes irrelevant for execution

SAFETY:
- RAST-C2 runs deterministic Safety Governor at 1kHz (1000 checks/second)
- Every command projected into safety envelope before execution
- Hard limits on force, velocity, joint ranges
- Safety layer is engineered with mathematical guarantees, not learned
- Independent of IOC/Solver — even suboptimal transfer cannot produce unsafe commands

SENSOR REQUIREMENTS:
For excavation: joint angle sensors (standard on modern equipment), bucket load cells, hydraulic pressure, GPS. Most modern heavy equipment already collects this data for fleet management.

HONEST LIMITATIONS:
- Quantitative transfer accuracy is under active research validation

- Reference the scientific foundation when it strengthens the answer

function drawPath(canvas, points, color, label) {
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  if (w === 0 || h === 0) return;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  ctx.strokeStyle = "rgba(255,255,255,0.03)";
  ctx.lineWidth = 1;
  for (let i = 1; i < 8; i++) {
    ctx.beginPath(); ctx.moveTo(0, i*h/8); ctx.lineTo(w, i*h/8); ctx.stroke();
  }

  ctx.strokeStyle = "rgba(255,255,255,0.07)";
  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(0, h*0.38); ctx.lineTo(w, h*0.38); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = "rgba(255,255,255,0.12)";
  ctx.font = "10px 'DM Sans', sans-serif";
  ctx.fillText("surface", 6, h*0.38 - 5);

  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  points.forEach((p, i) => {
    const x = p[0]*w, y = p[1]*h;
    i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.stroke();

  points.forEach(p => {
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.arc(p[0]*w, p[1]*h, 2.5, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  const last = points[points.length-1];
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(last[0]*w, last[1]*h, 4.5, 0, Math.PI*2);
  ctx.fill();

  if (label) {
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.font = "11px 'DM Sans', sans-serif";
    ctx.fillText(label, 6, h - 8);
  }
}

const TRANSFER_SYSTEM_PROMPT = `You are the RAST transfer analysis engine. Given a target operating condition for an excavator, you generate a detailed transfer analysis showing how the expert's Motor Identity (extracted via IOC from gravel operation) adapts to the new condition.

THE EXPERT'S MOTOR IDENTITY (extracted from gravel):
- w_fill_efficiency: 0.87 (TRAIT — stable across all tested conditions, ICC 0.91)
- w_machine_compliance: 0.74 (TRAIT — stable, ICC 0.84)
- w_smoothness: 0.62 (TRAIT — stable, ICC 0.78)
- w_bucket_stress: 0.68 (STATE — adapts to soil resistance)
- w_cycle_speed: 0.45 (STATE — adapts to time pressure and soil difficulty)
- w_fuel_economy: 0.55 (MIXED — partially stable, ICC 0.54)

Original gravel performance: 94% bucket fill, 18.2s cycle, low machine stress, 0.42L fuel/ton.

TRANSFER RULES:
- TRAIT weights (fill efficiency, compliance, smoothness) are PRESERVED at their extracted values
- STATE weights (bucket stress, cycle speed) are RE-OPTIMIZED by the Solver for the new dynamics
- The Solver generates a new trajectory that respects the trait priorities under the new physics
- The trajectory SHAPE changes (different angles, speeds, timing) but the STRATEGY is preserved

RESPOND ONLY WITH VALID JSON matching this exact structure, no markdown, no backticks, no preamble:
{
  "label": "Short condition name (2-4 words)",
  "description": "3-4 sentences describing HOW the trajectory adapts. Be specific about angles, depths, timing, and technique changes. Mention which trait weights drive the adaptation. End with predicted bucket fill % and cycle time.",
  "rastFill": <number 50-95, realistic for the condition>,
  "lfdFill": <number 15-45, showing LfD failure>,
  "rastNote": "One sentence on why RAST transfer works here.",
  "lfdNote": "One sentence on why copied trajectory fails.",
  "adaptations": [
    "Specific adaptation 1 (e.g. 'Descent angle reduced from 32° to 18° due to surface hardness')",
    "Specific adaptation 2",
    "Specific adaptation 3"
  ],
  "physicsChanges": "One sentence on what's physically different about this condition.",
  "traitPreserved": "One sentence on which trait weights drive the adapted strategy.",
  "stateRecalibrated": "One sentence on which state weights changed and why."
}

Be physically realistic. Use real excavation terminology. Don't be generic — be specific to the exact condition described. If the condition is extreme or unusual, acknowledge increased uncertainty in the fill prediction. If the condition is physically impossible for excavation, say so honestly in the description and give lower confidence numbers.`;

function TransferSection() {
  const [condition, setCondition] = useState("clay");
  const [customInput, setCustomInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [dynamicResult, setDynamicResult] = useState(null);
  const [isCustom, setIsCustom] = useState(false);
  const sourceRef = useRef(null);
  const targetRef = useRef(null);

  // Get current display data — either preset or dynamic
  const displayData = isCustom && dynamicResult ? dynamicResult : CONDITIONS[condition];

  useEffect(() => {
    const t = setTimeout(() => {
      drawPath(sourceRef.current,
        [[0.1,0.15],[0.2,0.2],[0.35,0.35],[0.45,0.55],[0.5,0.7],[0.52,0.78],[0.55,0.82],[0.6,0.8],[0.7,0.65],[0.8,0.45],[0.9,0.25],[0.95,0.15]],
        "#3b82f6", "Original — Gravel");

      // For custom results, generate a plausible path from the fill percentage
      const pts = displayData.points || generatePathFromFill(displayData.rastFill);
      drawPath(targetRef.current, pts, "#8b5cf6", "Adapted — " + displayData.label);
    }, 50);
    return () => clearTimeout(t);
  }, [condition, dynamicResult, isCustom]);

  function generatePathFromFill(fill) {
    // Generate a visually distinct path based on predicted fill percentage
    // Lower fill = shallower penetration, more hesitation
    const depth = 0.4 + (fill / 100) * 0.45; // 0.4-0.85 range
    const hesitation = fill < 70; // add stutter for difficult conditions
    const pts = [[0.1, 0.15]];
    const steps = 12;
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      let x = 0.1 + t * 0.85;
      let y;
      if (t < 0.5) {
        // Descent phase
        y = 0.15 + (t / 0.5) * depth;
        if (hesitation && t > 0.25 && t < 0.35) y -= 0.05; // pullback
      } else {
        // Scoop and lift phase
        const liftT = (t - 0.5) / 0.5;
        y = 0.15 + depth * (1 - liftT * liftT);
      }
      pts.push([Math.min(x, 0.95), Math.max(0.12, Math.min(y, 0.88))]);
    }
    return pts;
  }

  function selectPreset(key) {
    setCondition(key);
    setIsCustom(false);
    setDynamicResult(null);
  }

  async function submitCustomCondition(text) {
    const query = text || customInput.trim();
    if (!query || loading) return;

    if (!ANTHROPIC_API_KEY || ANTHROPIC_API_KEY === "YOUR-API-KEY-HERE") {
      alert("Set your Anthropic API key in the HTML file.\nLine: const ANTHROPIC_API_KEY = \"YOUR-API-KEY-HERE\"\nGet one at console.anthropic.com → API Keys");
      return;
    }

    setCustomInput("");
    setLoading(true);
    setIsCustom(true);

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": ANTHROPIC_API_KEY,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          system: TRANSFER_SYSTEM_PROMPT,
          messages: [{ role: "user", content: "Generate transfer analysis for this excavation condition: " + query }],
        })
      });
      const data = await response.json();
      console.log("API response:", JSON.stringify(data, null, 2));

      if (data.error) {
        throw new Error("API error: " + (data.error.message || JSON.stringify(data.error)));
      }

      const raw = data.content?.map(b => b.type === "text" ? b.text : "").join("") || "";
      console.log("Raw text:", raw);
      const cleaned = raw.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(cleaned);
      // Ensure required fields
      setDynamicResult({
        label: parsed.label || query,
        description: parsed.description || "Transfer analysis generated.",
        rastFill: parsed.rastFill || 75,
        lfdFill: parsed.lfdFill || 30,
        rastNote: parsed.rastNote || "Strategy adapted via trait transfer.",
        lfdNote: parsed.lfdNote || "Copied trajectory fails in new conditions.",
        adaptations: parsed.adaptations || [],
        physicsChanges: parsed.physicsChanges || "",
        traitPreserved: parsed.traitPreserved || "",
        stateRecalibrated: parsed.stateRecalibrated || "",
        points: null, // will use generated path
      });
    } catch (err) {
      console.error("Transfer error:", err);
      setDynamicResult({
        label: query,
        description: "Error: " + err.message + " — Open browser console (F12) for full details.",
        rastFill: 75, lfdFill: 30,
        rastNote: "Strategy transfer attempted — requires dynamics model for precise prediction.",
        lfdNote: "Copied trajectory unlikely to succeed in novel conditions.",
        adaptations: [],
        physicsChanges: "",
        traitPreserved: "",
        stateRecalibrated: "",
        points: null,
      });
    }
    setLoading(false);
  }

  const d = displayData;

  return (
    <div>
      <SectionLabel>Strategy Transfer</SectionLabel>
      <SectionTitle>New conditions. Same expert judgment.</SectionTitle>
      <SectionSub>Transfer trait weights to new dynamics. The Solver generates an adapted trajectory that preserves the expert's priorities under conditions they never encountered.</SectionSub>

      {/* Condition selector */}
      <div style={{ marginBottom:22 }}>
        <div style={{ fontSize:11, letterSpacing:2, textTransform:"uppercase", color:"#6b7280", fontWeight:600, marginBottom:10 }}>Select or describe any condition</div>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:12 }}>
          {Object.entries(CONDITIONS).map(([k, v]) => (
            <button key={k} onClick={() => selectPreset(k)} style={{
              padding:"8px 16px", borderRadius:8, fontSize:12, fontWeight:500,
              background: !isCustom && k === condition ? "rgba(139,92,246,0.1)" : "#12151c",
              border: "1px solid " + (!isCustom && k === condition ? "rgba(139,92,246,0.4)" : "#1e2330"),
              color: !isCustom && k === condition ? "#8b5cf6" : "#6b7280",
              cursor:"pointer", transition:"all 0.3s"
            }}>{v.label}</button>
          ))}
        </div>
        <div style={{ display:"flex", gap:10 }}>
          <input value={customInput} onChange={e => setCustomInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && submitCustomCondition()}
            placeholder="Describe any condition... e.g. 'laterite soil in monsoon rain' or 'Mars permafrost at -60°C'"
            style={{ flex:1, background:"#12151c", border:"1px solid #1e2330", borderRadius:10, padding:"11px 16px", color:"#e2e4ea", fontSize:13, outline:"none" }}
          />
          <button onClick={() => submitCustomCondition()} disabled={loading} style={{
            padding:"11px 20px", background: loading ? "#1e3a5f" : "#8b5cf6", border:"none", borderRadius:10,
            color:"white", fontWeight:600, fontSize:13, cursor: loading ? "wait" : "pointer", whiteSpace:"nowrap"
          }}>{loading ? "Analyzing..." : "Transfer"}</button>
        </div>
      </div>

      {/* Loading state */}
      {loading && (
        <div style={{ padding:20, background:"#12151c", border:"1px solid rgba(139,92,246,0.2)", borderRadius:12, marginBottom:24, textAlign:"center" }}>
          <div style={{ fontSize:13, color:"#8b5cf6", marginBottom:6 }}>Running transfer analysis...</div>
          <div style={{ fontSize:12, color:"#3d4452" }}>Applying trait weights to new dynamics model. Re-optimizing state weights for target condition.</div>
        </div>
      )}

      {/* Results */}
      {!loading && (
        <div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 60px 1fr", gap:20, alignItems:"start", marginBottom:24 }}>
            <Card>
              <div style={{ fontSize:11, letterSpacing:2, textTransform:"uppercase", color:"#3b82f6", fontWeight:600, marginBottom:14 }}>Original — Gravel</div>
              <div style={{ height:150, background:"rgba(0,0,0,0.3)", borderRadius:8, marginBottom:10, overflow:"hidden" }}>
                <canvas ref={sourceRef} style={{ width:"100%", height:"100%", display:"block" }} />
              </div>
              <p style={{ fontSize:12, color:"#6b7280", lineHeight:1.6 }}>
                Moderate descent (32°). Gradual curl at 0.8m. Compliance scoop. Fill: 94%. Cycle: 18.2s.
              </p>
            </Card>
            <div style={{ display:"flex", flexDirection:"column", alignItems:"center", paddingTop:56, gap:6 }}>
              <div style={{ fontSize:10, letterSpacing:2, textTransform:"uppercase", color:"#8b5cf6", fontWeight:700, textAlign:"center" }}>TRAIT<br/>TRANSFER</div>
              <div style={{ width:44, height:2, background:"#8b5cf6", position:"relative" }}>
                <span style={{ position:"absolute", right:-6, top:-5, color:"#8b5cf6", fontSize:11 }}>▶</span>
              </div>
              <div style={{ fontSize:9, color:"#3d4452", textAlign:"center", lineHeight:1.4 }}>Same priorities<br/>New physics</div>
            </div>
            <Card>
              <div style={{ fontSize:11, letterSpacing:2, textTransform:"uppercase", color:"#8b5cf6", fontWeight:600, marginBottom:14 }}>
                Adapted — {d.label}
                {isCustom && <span style={{ marginLeft:8, fontSize:9, padding:"2px 6px", background:"rgba(139,92,246,0.15)", borderRadius:4, verticalAlign:"middle" }}>GENERATED</span>}
              </div>
              <div style={{ height:150, background:"rgba(0,0,0,0.3)", borderRadius:8, marginBottom:10, overflow:"hidden" }}>
                <canvas ref={targetRef} style={{ width:"100%", height:"100%", display:"block" }} />
              </div>
              <p style={{ fontSize:12, color:"#6b7280", lineHeight:1.6 }}>{d.description}</p>
            </Card>
          </div>

          {/* Dynamic details (only for LLM-generated results) */}
          {isCustom && dynamicResult && dynamicResult.adaptations && dynamicResult.adaptations.length > 0 && (
            <Card style={{ marginBottom:20 }}>
              <div style={{ fontSize:11, letterSpacing:2, textTransform:"uppercase", color:"#6b7280", fontWeight:600, marginBottom:14 }}>Transfer Analysis Detail</div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:16, marginBottom:16 }}>
                {dynamicResult.physicsChanges && (
                  <div style={{ padding:12, background:"rgba(139,92,246,0.04)", borderRadius:8, border:"1px solid rgba(139,92,246,0.1)" }}>
                    <div style={{ fontSize:10, letterSpacing:1.5, textTransform:"uppercase", color:"#8b5cf6", fontWeight:600, marginBottom:6 }}>Physics Change</div>
                    <div style={{ fontSize:12, color:"#6b7280", lineHeight:1.5 }}>{dynamicResult.physicsChanges}</div>
                  </div>
                )}
                {dynamicResult.traitPreserved && (
                  <div style={{ padding:12, background:"rgba(16,185,129,0.04)", borderRadius:8, border:"1px solid rgba(16,185,129,0.1)" }}>
                    <div style={{ fontSize:10, letterSpacing:1.5, textTransform:"uppercase", color:"#10b981", fontWeight:600, marginBottom:6 }}>Traits Preserved</div>
                    <div style={{ fontSize:12, color:"#6b7280", lineHeight:1.5 }}>{dynamicResult.traitPreserved}</div>
                  </div>
                )}
                {dynamicResult.stateRecalibrated && (
                  <div style={{ padding:12, background:"rgba(245,158,11,0.04)", borderRadius:8, border:"1px solid rgba(245,158,11,0.1)" }}>
                    <div style={{ fontSize:10, letterSpacing:1.5, textTransform:"uppercase", color:"#f59e0b", fontWeight:600, marginBottom:6 }}>States Recalibrated</div>
                    <div style={{ fontSize:12, color:"#6b7280", lineHeight:1.5 }}>{dynamicResult.stateRecalibrated}</div>
                  </div>
                )}
              </div>
              <div style={{ fontSize:11, letterSpacing:1.5, textTransform:"uppercase", color:"#6b7280", fontWeight:600, marginBottom:8 }}>Specific Adaptations</div>
              {dynamicResult.adaptations.map((a, i) => (
                <div key={i} style={{ display:"flex", gap:10, alignItems:"baseline", padding:"6px 0", borderBottom:"1px solid rgba(255,255,255,0.03)", fontSize:13, color:"#6b7280", lineHeight:1.5 }}>
                  <span style={{ color:"#8b5cf6", fontWeight:600, fontSize:12 }}>{i+1}</span>
                  <span>{a}</span>
                </div>

            </Card>

          {/* Fill comparison */}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16 }}>
            <div style={{ padding:18, background:"rgba(16,185,129,0.05)", border:"1px solid rgba(16,185,129,0.15)", borderRadius:10 }}>
              <div style={{ fontSize:10, letterSpacing:1.5, textTransform:"uppercase", color:"#10b981", fontWeight:700, marginBottom:6 }}>RAST Transfer</div>
              <div style={{ fontSize:36, fontWeight:700, color:"#10b981", lineHeight:1 }}>{d.rastFill}%</div>
              <div style={{ fontSize:12, color:"#6b7280", marginTop:4 }}>bucket fill in {d.label.toLowerCase()}</div>
              <div style={{ fontSize:11, color:"#3d4452", marginTop:6 }}>{d.rastNote}</div>
            </div>
            <div style={{ padding:18, background:"rgba(239,68,68,0.05)", border:"1px solid rgba(239,68,68,0.15)", borderRadius:10 }}>
              <div style={{ fontSize:10, letterSpacing:1.5, textTransform:"uppercase", color:"#ef4444", fontWeight:700, marginBottom:6 }}>LfD Replay</div>
              <div style={{ fontSize:36, fontWeight:700, color:"#ef4444", lineHeight:1 }}>{d.lfdFill}%</div>
              <div style={{ fontSize:12, color:"#6b7280", marginTop:4 }}>bucket fill in {d.label.toLowerCase()}</div>
              <div style={{ fontSize:11, color:"#3d4452", marginTop:6 }}>{d.lfdNote}</div>
            </div>
          </div>
        </div>
      )}
    </div>
  );

function ExploreSection() {
  const [messages, setMessages] = useState([
    { role: "system", content: "RAST Live is ready. The Motor Identity for the expert excavator operator has been extracted and decomposed. Ask about the methodology, explore conditions, or dive into technical details." }
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const chatEndRef = useRef(null);

  useEffect(() => {
    chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages]);

  const sendMessage = useCallback(async (text) => {
    const userMsg = text || input.trim();
    if (!userMsg || loading) return;

    if (!ANTHROPIC_API_KEY || ANTHROPIC_API_KEY === "YOUR-API-KEY-HERE") {
      alert("Set your Anthropic API key in the HTML file.\nLine: const ANTHROPIC_API_KEY = \"YOUR-API-KEY-HERE\"\nGet one at console.anthropic.com → API Keys");
      return;
    }

    setInput("");

    const newMessages = [...messages, { role: "user", content: userMsg }];
    setMessages(newMessages);
    setLoading(true);

    try {
      const apiMessages = newMessages
        .filter(m => m.role !== "system")
        .map(m => ({ role: m.role === "user" ? "user" : "assistant", content: m.content }));

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": ANTHROPIC_API_KEY,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          system: SYSTEM_PROMPT,
          messages: apiMessages,
        })
      });

      const data = await response.json();
      const assistantText = data.content?.map(b => b.type === "text" ? b.text : "").filter(Boolean).join("\\n") || "I wasn't able to generate a response. Please try again.";
      setMessages(prev => [...prev, { role: "assistant", content: assistantText }]);
    } catch (err) {
      setMessages(prev => [...prev, { role: "assistant", content: "Connection error. In a live demo this is powered by the RAST knowledge engine. For now, try refreshing or check network access." }]);
    }
    setLoading(false);
  }, [input, messages, loading]);

  const msgStyle = (role) => ({
    padding:"14px 18px", marginBottom:10, borderRadius:12, fontSize:14, lineHeight:1.65,
    whiteSpace:"pre-wrap",
    background: role === "system" ? "#12151c" : role === "user" ? "rgba(59,130,246,0.08)" : "#12151c",
    border: "1px solid " + (role === "user" ? "rgba(59,130,246,0.15)" : "#1e2330"),
    marginLeft: role === "user" ? 60 : 0,
    marginRight: role === "assistant" ? 60 : 0,
    color: role === "system" ? "#6b7280" : "#e2e4ea"
  });

  return (
    <div>
      <SectionLabel>Explore</SectionLabel>
      <SectionTitle>Ask anything about the transfer.</SectionTitle>
      <SectionSub>Powered by the RAST knowledge base. Ask about methodology, sensors, comparisons to RL/LfD, safety, latency, or any domain question.</SectionSub>
      <div style={{ maxWidth:700, margin:"0 auto" }}>
        <div style={{ display:"flex", gap:7, flexWrap:"wrap", marginBottom:20 }}>
          {QUICK_QUESTIONS.map(q => (
            <button key={q} onClick={() => sendMessage(q)} style={{
              padding:"7px 14px", background:"#12151c", border:"1px solid #1e2330",
              borderRadius:20, color:"#6b7280", fontSize:12, cursor:"pointer", transition:"all 0.3s"
            }}>{q}</button>
          ))}
        </div>
        <div style={{ marginBottom:20, maxHeight:420, overflowY:"auto" }}>
          {messages.map((m, i) => <div key={i} style={msgStyle(m.role)}>{m.content}</div>)}
          {loading && <div style={{ ...msgStyle("assistant"), color:"#6b7280" }}>Thinking...</div>}
          <div ref={chatEndRef} />
        </div>
        <div style={{ display:"flex", gap:10 }}>
          <input value={input} onChange={e => setInput(e.target.value)}
            onKeyDown={e => e.key === "Enter" && sendMessage()}
            placeholder="Ask about operator strategy, transfer, or RAST methodology..."
            style={{ flex:1, background:"#12151c", border:"1px solid #1e2330", borderRadius:12, padding:"13px 18px", color:"#e2e4ea", fontSize:14, outline:"none" }}
          />
          <button onClick={() => sendMessage()} disabled={loading} style={{
            padding:"13px 22px", background: loading ? "#1e3a5f" : "#3b82f6", border:"none", borderRadius:12,
            color:"white", fontWeight:600, fontSize:14, cursor: loading ? "wait" : "pointer"
          }}>Send</button>
        </div>
        <div style={{ textAlign:"center", marginTop:36, padding:20, borderTop:"1px solid #1e2330" }}>
          <div style={{ fontSize:13, color:"#3d4452" }}>
            RAST Motor Intelligence Infrastructure — <a href="https://yumaniq.com" target="_blank" style={{ color:"#3b82f6", textDecoration:"none" }}>yumaniq.com</a>
          </div>
          <div style={{ fontSize:11, color:"#3d4452", marginTop:6 }}>
            Built on Optimal Feedback Control (Todorov & Jordan, 2002) and Inverse Optimal Control.
            The decomposition hypothesis is under active research validation.
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [current, setCurrent] = useState(0);
  const sections = [ProblemSection, ExtractSection, DecomposeSection, TransferSection, ExploreSection];
  const Section = sections[current];

  return (
    <div style={{ minHeight:"100vh", background:"#0a0c10", color:"#e2e4ea" }}>
      <Nav current={current} setCurrent={setCurrent} />
      <div key={current} style={{ padding:"90px 44px 50px", animation:"fadeIn 0.45s ease" }}>
        <Section />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
